<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

:root {
  --cream: #f7f3ec;
  --ink: #1c1a16;
  --ink-soft: #4a4640;
  --ink-muted: #9a9590;
  --gold: #b89a5a;
  --gold-light: #e8d9b5;
  --blue: #2c4a6e;
  --purple: #534AB7;
  --coral: #993C1D;
  --green: #3B6D11;
  --gray: #5F5E5A;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--cream);
  color: var(--ink);
  font-family: 'Cormorant Garamond', Georgia, serif;
  min-height: 100vh;
}

.page-header {
  border-bottom: 1px solid var(--gold-light);
  padding: 3rem 3rem 2rem;
  position: relative;
  overflow: hidden;
}

.page-header::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 200px; height: 200px;
  border: 1px solid var(--gold-light);
  border-radius: 50%;
  opacity: 0.5;
}

.page-header::after {
  content: '';
  position: absolute;
  bottom: -60px; right: 60px;
  width: 120px; height: 120px;
  border: 1px solid var(--gold-light);
  border-radius: 50%;
  opacity: 0.3;
}

.eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 1rem;
}

h1 {
  font-size: clamp(28px, 5vw, 48px);
  font-weight: 300;
  line-height: 1.15;
  color: var(--ink);
  margin-bottom: 0.5rem;
}

h1 em { font-style: italic; color: var(--ink-soft); }

.subtitle {
  font-size: 15px;
  color: var(--ink-muted);
  font-style: italic;
  margin-top: 0.75rem;
}

.tei-ref {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--ink-muted);
  margin-top: 1.5rem;
  padding: 8px 12px;
  border-left: 2px solid var(--gold-light);
  display: inline-block;
}

.main {
  display: grid;
  grid-template-columns: 200px 1fr;
  min-height: calc(100vh - 180px);
}

.sidebar {
  border-right: 1px solid var(--gold-light);
  padding: 2rem 1.5rem;
  position: sticky;
  top: 0;
  height: fit-content;
}

.sidebar-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 1.25rem;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 0.75rem;
  cursor: pointer;
  padding: 4px 0;
  transition: opacity 0.2s;
}

.legend-item:hover { opacity: 0.7; }
.legend-item.inactive { opacity: 0.3; }
