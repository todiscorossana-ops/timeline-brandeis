<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline Montale – Brandeis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: Georgia, serif;
      background: #f5f1ea;
      color: #1e1e1e;
    }

    .timeline-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #c8b79f;
      transform: translateX(-50%);
    }

    .timeline-item {
      position: relative;
      width: 50%;
      padding: 2rem;
    }

    .timeline-item.left {
      left: 0;
      text-align: right;
    }

    .timeline-item.right {
      left: 50%;
      text-align: left;
    }

    .timeline-dot {
      position: absolute;
      top: 2.5rem;
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      background: #8b5e3c;
      border: 4px solid #f5f1ea;
      z-index: 10;
    }

    .timeline-item.left .timeline-dot {
      right: -9px;
    }

    .timeline-item.right .timeline-dot {
      left: -9px;
    }

    .card {
      background: white;
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border-top: 6px solid;
    }

    /* Mapping dei tipi dell'XML ai colori */
    .Biografico, .biografico { border-color: #8b5e3c; }
    .Letterario, .letterario { border-color: #b91c1c; }
    .Accademico, .accademico { border-color: #1d4ed8; }
    .Documenti, .documenti { border-color: #9333ea; }

    .date {
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 0.5rem;
    }

    .title {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      font-weight: bold;
    }

    .type-label {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      background: #eee;
    }

    @media (max-width: 768px) {
      .timeline-line {
        left: 20px;
      }

      .timeline-item,
      .timeline-item.left,
      .timeline-item.right {
        width: 100%;
        left: 0;
        text-align: left;
        padding-left: 4rem;
        padding-right: 1rem;
      }

      .timeline-item.left .timeline-dot,
      .timeline-item.right .timeline-dot {
        left: 11px;
      }
    }
  </style>
</head>
<body>

  <header class="py-16 px-6 text-center max-w-4xl mx-auto">
    <h1 class="text-5xl font-bold mb-6">Eugenio Montale & Irma Brandeis</h1>
    <p class="text-lg text-gray-700 leading-relaxed">
      Timeline aggiornata basata sui documenti d'archivio e le pubblicazioni letterarie.
    </p>
  </header>

  <main class="relative max-w-6xl mx-auto pb-24">
    <div class="timeline-line"></div>
    <div id="timeline"></div>
  </main>

  <script>
    // Stringa XML aggiornata con i tuoi nuovi dati
    const xmlString = `
<listEvent>
    <event type="Biografico">
      <head>Nascita di Eugenio Montale</head>
      <date when="1896-10-12">12 ottobre 1896</date>
      <p>Eugenio Montale nasce a Genova il 12 ottobre 1896.</p>
    </event>

    <event type="Biografico">
      <head>Nascita di Irma Brandeis</head>
      <date when="1905">1905</date>
      <p>Irma Brandeis nasce a New York da una famiglia ebraica di origine austro-boema.</p>
    </event>

    <event type="Letterario">
      <head>Pubblicazione degli Ossi di seppia</head>
      <date when="1925-06-15">15 giugno 1925</date>
      <p>Prima raccolta poetica di Montale, pubblicata da Gobetti. È il libro che Brandeis cita come ragione del suo avvicinamento al poeta.</p>
    </event>

    <event type="Accademico">
      <head>Montale direttore del Vieusseux</head>
      <date when="1929">1929</date>
      <p>Viene nominato direttore del Gabinetto Vieusseux di Firenze, ruolo che manterrà fino al 1938, quando verrà destituito per non aver aderito al Partito Fascista.</p>
    </event>

    <event type="biografico">
      <head>Primo soggiorno fiorentino di Irma Brandeis</head>
      <date when="1931">1931</date>
      <p>Irma viene a Firenze per la prima volta con l'intenzione di scrivere un libro sui suoi studi danteschi.</p>
    </event>

    <event type="Biografico">
      <head>Primo incontro al Vieusseux</head>
      <date when="1933">1933</date>
      <p>Irma si reca al Vieusseux chiedendo di Montale. Inizia una frequentazione quotidiana tra caffè e passeggiate lungo il fiume.</p>
    </event>

    <event type="Documenti">
      <head>Lettera a Gino Bigongiari</head>
      <date when="1933-07-20">20 luglio 1933</date>
      <p>Irma scrive: «C'è una sola, necessaria precisazione da fare: sono ridicolmente felice.»</p>
    </event>

    <event type="biografico">
      <head>Montale parte per Londra con Drusilla Tanzi</head>
      <date when="1933-08">agosto 1933</date>
      <p>Montale soggiorna a Londra insieme a Drusilla Tanzi (Mosca), di cui Irma ancora non conosce l'esistenza.</p>
    </event>

    <event type="Documenti">
      <head>Lettera a Bigongiari</head>
      <date when="1933">1933</date>
      <p>Irma descrive Montale: «molto gentile, davvero semplice, alquanto brutto». Confessa di trovare meravigliosa la sua poesia.</p>
    </event>

    <event type="Biografico">
      <head>Irma lascia l'Italia per le leggi razziali</head>
      <date when="1938">1938</date>
      <p>Le leggi razziali rendono impossibile la permanenza di Irma come studiosa ebrea americana.</p>
    </event>

    <event type="Letterario">
      <head>Pubblicazione de Le Occasioni</head>
      <date when="1939">1939</date>
      <p>Montale pubblica Le Occasioni, dedicata a Irma trasfigurata col nome di Clizia.</p>
    </event>

    <event type="Letterario">
      <head>Irma pubblica The Ladder of Vision</head>
      <date when="1960">1960</date>
      <p>Culmine degli anni di studi danteschi, il volume analizza l'imagery nella Commedia.</p>
    </event>

    <event type="biografico">
      <head>Morte di Drusilla Tanzi</head>
      <date when="1963">1963</date>
      <p>Muore Drusilla Tanzi, compagna e poi moglie di Montale, trasfigurata come Xenia in Satura.</p>
    </event>

    <event type="Accademico">
      <head>Montale cita The Ladder of Vision</head>
      <date when="1965">1965</date>
      <p>Montale menziona l'opera di Irma, definendola «quanto di più suggestivo» avesse letto sull'argomento.</p>
    </event>

    <event type="Letterario">
      <head>Montale pubblica Satura</head>
      <date when="1971">1971</date>
      <p>Montale dedica la raccolta a Drusilla Tanzi. Irma osserva nelle annotazioni: «Xenia ottiene ciò che desidera: incolpandomi...»</p>
    </event>

    <event type="Accademico">
      <head>Montale: Premio Nobel per la letteratura</head>
      <date when="1975">1975</date>
      <p>Riconoscimento del suo ruolo centrale nella poesia italiana del Novecento.</p>
    </event>

    <event type="Documenti">
      <head>Annotazioni sul nome Clizia</head>
      <date when="1980">1980</date>
      <p>Irma, anziana, rifiuta l'identificazione con il personaggio poetico e rivendica la propria soggettività autonoma.</p>
    </event>

    <event type="Documenti">
      <head>Ultimo biglietto di Montale</head>
      <date when="1981">1981</date>
      <p>Montale scrive: «Irma, sei ancora la mia dea, la mia divinità. Quando, come ci rincontreremo?»</p>
    </event>

    <event type="Biografico">
      <head>Morte di Eugenio Montale</head>
      <date when="1981-09-12">12 settembre 1981</date>
      <p>«Montale è morto.» Irma riceve la notizia mentre pianificava un viaggio in Italia per rivederlo.</p>
    </event>

    <event type="Biografico">
      <head>Morte di Irma Brandeis</head>
      <date when="1990">1990</date>
      <p>Irma Brandeis muore ad Annandale-on-Hudson, dove aveva insegnato per decenni al Bard College.</p>
    </event>
</listEvent>`;

    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlString, 'application/xml');
    const events = [...xml.querySelectorAll('event')];

    const timeline = document.getElementById('timeline');

    events.forEach((event, index) => {
      const type = event.getAttribute('type');
      const title = event.querySelector('head')?.textContent || '';
      const date = event.querySelector('date')?.textContent || '';
      const text = event.querySelector('p')?.textContent || '';

      const side = index % 2 === 0 ? 'left' : 'right';

      const item = document.createElement('div');
      item.className = `timeline-item ${side}`;

      item.innerHTML = `
        <div class="timeline-dot"></div>
        <div class="card ${type}">
          <div class="date">${date}</div>
          <div class="type-label">${type}</div>
          <div class="title">${title}</div>
          <p class="leading-relaxed text-gray-700">${text}</p>
        </div>
      `;

      timeline.appendChild(item);
    });
  </script>

</body>
</html>
