<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Montale-Brandeis</title>
    <style>
        :root {
            --biografico: #e74c3c;
            --letterario: #2ecc71;
            --accademico: #3498db;
            --documenti: #f1c40f;
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        /* Filtri */
        .filters {
            text-align: center;
            margin-bottom: 30px;
        }

        .filter-btn {
            background: #fff;
            border: 2px solid #ddd;
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s;
            font-weight: bold;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #2c3e50;
            color: #fff;
            border-color: #2c3e50;
        }

        /* Timeline Container */
        .timeline {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 0;
        }

        /* Linea centrale */
        .timeline::after {
            content: '';
            position: absolute;
            width: 4px;
            background-color: #ddd;
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -2px;
        }

        /* Event Container */
        .event-container {
            padding: 10px 40px;
            position: relative;
            width: 50%;
            box-sizing: border-box;
            opacity: 1;
            transition: all 0.4s ease;
        }

        .event-container.hide {
            display: none;
        }

        /* Alternanza destra/sinistra */
        .left { left: 0; text-align: right; }
        .right { left: 50%; text-align: left; }

        /* Cerchietti sulla linea */
        .event-container::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            right: -10px;
            background-color: white;
            border: 4px solid var(--biografico);
            top: 25px;
            border-radius: 50%;
            z-index: 1;
        }

        .right::after { left: -10px; }

        /* Card dell'evento */
        .content {
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }

        .date {
            font-weight: bold;
            color: #7f8c8d;
            display: block;
            margin-bottom: 5px;
        }

        h3 {
            margin-top: 0;
            color: #333;
            font-size: 1.2rem;
        }

        .tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            color: white;
            margin-bottom: 10px;
            display: inline-block;
        }

        /* Colori Categorie */
        .type-biografico .tag, .type-biografico::after { border-color: var(--biografico); background-color: var(--biografico); }
        .type-letterario .tag, .type-letterario::after { border-color: var(--letterario); background-color: var(--letterario); }
        .type-accademico .tag, .type-accademico::after { border-color: var(--accademico); background-color: var(--accademico); }
        .type-documenti .tag, .type-documenti::after { border-color: var(--documenti); background-color: var(--documenti); color: #333; }

        /* Responsive */
        @media screen and (max-width: 600px) {
            .timeline::after { left: 31px; }
            .event-container { width: 100%; padding-left: 70px; padding-right: 25px; text-align: left !important; }
            .event-container::after { left: 21px; right: auto; }
            .right { left: 0%; }
        }
    </style>
</head>
<body>

<header>
    <h1>Eugenio Montale & Irma Brandeis</h1>
    <p>Una storia d'amore, poesia e letteratura</p>
</header>

<div class="filters">
    <button class="filter-btn active" onclick="filterEvents('all')">Tutti</button>
    <button class="filter-btn" onclick="filterEvents('biografico')">Biografico</button>
    <button class="filter-btn" onclick="filterEvents('letterario')">Letterario</button>
    <button class="filter-btn" onclick="filterEvents('accademico')">Accademico</button>
    <button class="filter-btn" onclick="filterEvents('documenti')">Documenti</button>
</div>

<div class="timeline" id="timeline">
    <!-- Gli eventi verranno inseriti qui dal JS -->
</div>

<script>
    const events = [
        { date: "12 ottobre 1896", year: 1896, type: "biografico", title: "Nascita di Eugenio Montale", text: "Eugenio Montale nasce a Genova." },
        { date: "1905", year: 1905, type: "biografico", title: "Nascita di Irma Brandeis", text: "Nasce a New York da una famiglia ebraica di origine austro-boema." },
        { date: "15 giugno 1925", year: 1925, type: "letterario", title: "Pubblicazione degli Ossi di seppia", text: "Prima raccolta poetica di Montale. È il libro che Brandeis cita come ragione del suo avvicinamento al poeta." },
        { date: "1929", year: 1929, type: "accademico", title: "Montale direttore del Vieusseux", text: "Viene nominato direttore del Gabinetto Vieusseux di Firenze." },
        { date: "1931", year: 1931, type: "biografico", title: "Primo soggiorno fiorentino di Irma", text: "Irma viene a Firenze per studi danteschi." },
        { date: "1933", year: 1933, type: "biografico", title: "Primo incontro al Vieusseux", text: "Irma chiede di conoscere il direttore. Inizia una frequentazione quotidiana fatta di passeggiate e conversazioni." },
        { date: "20 luglio 1933", year: 1933, type: "documenti", title: "Lettera a Gino Bigongiari", text: "«C'è una sola, necessaria precisazione da fare: sono ridicolmente felice.»" },
        { date: "Agosto 1933", year: 1933, type: "biografico", title: "Montale a Londra con Mosca", text: "Montale soggiorna a Londra con Drusilla Tanzi (Mosca). Irma non ne conosce ancora l'esistenza." },
        { date: "1933", year: 1933, type: "documenti", title: "Irma descrive Montale", text: "Lo definisce «molto gentile, davvero semplice, alquanto brutto», ma adora la sua poesia." },
        { date: "1938", year: 1938, type: "biografico", title: "Irma lascia l'Italia", text: "Le leggi razziali fasciste rendono impossibile la sua permanenza. Si recide il legame fisico." },
        { date: "1939", year: 1939, type: "letterario", title: "Pubblicazione de Le Occasioni", text: "Il libro è dedicato a Irma, trasfigurata nel mito di Clizia." },
        { date: "1960", year: 1960, type: "letterario", title: "The Ladder of Vision", text: "Irma pubblica il suo culmine di studi danteschi presso il Bard College." },
        { date: "1963", year: 1963, type: "biografico", title: "Morte di Drusilla Tanzi", text: "Muore la moglie di Montale, la 'Mosca', poi celebrata in Xenia." },
        { date: "1965", year: 1965, type: "accademico", title: "Montale cita Irma", text: "In un'esposizione loda l'opera di Irma come guida fondamentale per Dante." },
        { date: "1971", year: 1971, type: "letterario", title: "Pubblicazione di Satura", text: "Montale pubblica la raccolta dedicata a Xenia. Irma annota con amarezza il favore riconquistato dalla rivale." },
        { date: "1975", year: 1975, type: "accademico", title: "Premio Nobel a Montale", text: "Riconoscimento mondiale per il poeta." },
        { date: "1980", year: 1980, type: "documenti", title: "Annotazioni su Clizia", text: "Irma rivendica la sua identità: «Sono stanca di sentirmi chiedere che sono colei che è chiamata Clizia.»" },
        { date: "1981", year: 1981, type: "documenti", title: "Ultimo biglietto di Montale", text: "«Irma, sei ancora la mia dea... Quando ci rincontreremo?»" },
        { date: "12 settembre 1981", year: 1981, type: "biografico", title: "Morte di Eugenio Montale", text: "Una telefonata annuncia la fine. Irma stava pianificando un viaggio per vederlo." },
        { date: "1990", year: 1990, type: "biografico", title: "Morte di Irma Brandeis", text: "Muore ad Annandale-on-Hudson dopo decenni di insegnamento." }
    ];

    function renderTimeline() {
        const container = document.getElementById('timeline');
        container.innerHTML = '';

        events.forEach((event, index) => {
            const side = index % 2 === 0 ? 'left' : 'right';
            const html = `
                <div class="event-container ${side} type-${event.type}" data-type="${event.type}">
                    <div class="content">
                        <span class="tag">${event.type}</span>
                        <span class="date">${event.date}</span>
                        <h3>${event.title}</h3>
                        <p>${event.text}</p>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    function filterEvents(type) {
        // Aggiorna bottoni
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText.toLowerCase() === type) btn.classList.add('active');
            if(type === 'all' && btn.innerText === 'Tutti') btn.classList.add('active');
        });

        // Filtra elementi
        const items = document.querySelectorAll('.event-container');
        items.forEach(item => {
            if (type === 'all' || item.getAttribute('data-type') === type) {
                item.classList.remove('hide');
            } else {
                item.classList.add('hide');
            }
        });
    }

    renderTimeline();
</script>

</body>
</html>
